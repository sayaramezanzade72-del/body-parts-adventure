<script>


/* =========================
   BODY PARTS
========================= */

const parts = [

    {
        name:"eyes",
        icon:"👀"
    },

    {
        name:"ears",
        icon:"👂👂"
    },

    {
        name:"nose",
        icon:"👃"
    },

    {
        name:"mouth",
        icon:"👄"
    },

    {
        name:"hands",
        icon:"🖐️🖐️"
    },

    {
        name:"feet",
        icon:"🦶🦶"
    },

    {
        name:"arms",
        icon:"💪💪"
    },

    {
        name:"legs",
        icon:"🦵🦵"
    },

    {
        name:"fingers",
        icon:"☝️☝️☝️☝️☝️"
    },

    {
        name:"hair",
        icon:"💇"
    }

];


/* =========================
   AUDIO FILES
========================= */

const voiceFiles = {

    eyes:"eyes.mp3",

    ears:"ears.mp3",

    nose:"nose.mp3",

    mouth:"mouth.mp3",

    hands:"hands.mp3",

    feet:"feet.mp3",

    arms:"arm.mp3",

    legs:"legs.mp3",

    fingers:"fingers.mp3",

    hair:"hair.mp3"

};


const voiceAudio = {};


Object.keys(voiceFiles).forEach(
function(name){

    const audio =
        new Audio(
            voiceFiles[name]
        );

    audio.preload="auto";

    audio.volume=1.0;

    voiceAudio[name]=audio;

});


/* =========================
   FIND THIS AUDIO
========================= */

const findThisAudio =
    new Audio(
        "find-this.mp3"
    );

findThisAudio.preload="auto";

findThisAudio.volume=1.0;


/* =========================
   MUSIC
========================= */

const music =
    new Audio(
        "music.mp3"
    );

music.loop=true;

music.volume=0.25;


/* =========================
   AUDIO CONTEXT
========================= */

let audioContext=null;


function getAudioContext(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){

        return null;

    }

    if(!audioContext){

        audioContext =
            new AudioContext();

    }

    if(
        audioContext.state==="suspended"
    ){

        audioContext.resume();

    }

    return audioContext;

}


/* =========================
   TARGET VOICE
========================= */

function playTargetVoice(name){

    const targetAudio =
        voiceAudio[name];

    if(!targetAudio){

        console.log(
            "Missing audio:",
            name
        );

        return;

    }


    findThisAudio.pause();

    findThisAudio.currentTime=0;

    targetAudio.pause();

    targetAudio.currentTime=0;


    /*
       FIND THIS FIRST
    */

    findThisAudio
    .play()
    .then(function(){

        findThisAudio.onended =
        function(){

            targetAudio.currentTime=0;

            targetAudio
            .play()
            .catch(function(error){

                console.log(
                    "Voice error:",
                    error
                );

            });

        };

    })
    .catch(function(){

        /*
           If find-this cannot play,
           play body-part voice.
        */

        targetAudio
        .play()
        .catch(function(error){

            console.log(
                "Voice error:",
                error
            );

        });

    });

}


/* =========================
   SOUND EFFECTS
========================= */

function playNotes(notes){

    try{

        const ctx =
            getAudioContext();

        if(!ctx){

            return;

        }

        let start =
            ctx.currentTime;


        notes.forEach(
        function(freq){

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            oscillator.type="sine";

            oscillator.frequency.value=
                freq;


            gain.gain.setValueAtTime(
                0.001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                0.5,
                start+0.03
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                start+0.25
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start+0.28
            );


            start+=0.14;

        });

    }

    catch(error){}

}


function playWinSound(){

    playNotes([
        523,
        659,
        784,
        1047
    ]);

}


function playWrongSound(){

    playNotes([
        330,
        247
    ]);

}


function playTimeUpSound(){

    playNotes([
        392,
        330,
        262
    ]);

}


function playGameOverSound(){

    try{

        const ctx =
            getAudioContext();

        if(!ctx){

            return;

        }


        const notes=[
            330,
            294,
            247,
            196
        ];


        let start =
            ctx.currentTime;


        notes.forEach(
        function(freq){

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            oscillator.type=
                "sawtooth";


            oscillator.frequency.value=
                freq;


            gain.gain.setValueAtTime(
                0.001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                0.7,
                start+0.03
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                start+0.4
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start+0.45
            );


            start+=0.18;

        });

    }

    catch(error){}

}


/* =========================
   VARIABLES
========================= */

let score=0;

let lives=3;

let round=0;

let level=1;

let target=null;

let previousTarget="";

let cards=[];

let animationID=null;

let timerID=null;

let timeLeft=10;

let locked=false;

let playerName="Friend";


/* =========================
   START
========================= */

function startGame(){

    const ctx =
        getAudioContext();

    if(ctx){

        ctx.resume();

    }


    playerName =
        document
        .getElementById(
            "playerName"
        )
        .value
        .trim();


    if(playerName===""){

        playerName="Friend";

    }


    document
    .getElementById(
        "playerDisplay"
    )
    .textContent=
        playerName;


    document
    .getElementById(
        "successName"
    )
    .textContent=
        playerName;


    document
    .getElementById(
        "gameOverName"
    )
    .textContent=
        playerName;


    document
    .getElementById(
        "finalName"
    )
    .textContent=
        playerName;


    document
    .getElementById(
        "start"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "play"
    )
    .style.display=
        "block";


    score=0;

    lives=3;

    round=0;

    level=1;

    previousTarget="";

    locked=false;


    updateUI();


    music.currentTime=0;

    music
    .play()
    .catch(function(){});


    newRound();

}


/* =========================
   NEW GAME
========================= */

function newGame(){

    stopMovement();

    stopTimer();


    music.pause();

    music.currentTime=0;


    findThisAudio.pause();

    findThisAudio.currentTime=0;


    document
    .getElementById(
        "gameOver"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "finish"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "success"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "play"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "start"
    )
    .style.display=
        "flex";


    document
    .getElementById(
        "playerName"
    )
    .value="";


    score=0;

    lives=3;

    round=0;

    level=1;

    previousTarget="";

    locked=false;

}


/* =========================
   NEW ROUND
========================= */

function newRound(){

    stopMovement();

    stopTimer();

    locked=false;


    document
    .getElementById(
        "message"
    )
    .textContent="";


    if(round>=20){

        finishGame();

        return;

    }


    level =
        Math.floor(
            round/5
        )+1;


    let available =
        parts.filter(
        function(part){

            return part.name !==
                previousTarget;

        });


    target =
        available[
            Math.floor(
                Math.random()*
                available.length
            )
        ];


    previousTarget =
        target.name;


    document
    .getElementById(
        "level"
    )
    .textContent=
        level;


    createCards();

    startTimer();


    /*
       AUDIO ONLY
       NO TARGET IMAGE
    */

    setTimeout(
    function(){

        if(!locked){

            playTargetVoice(
                target.name
            );

        }

    },
    300
    );

}


/* =========================
   TIMER
========================= */

function startTimer(){

    timeLeft =
        Math.max(
            7,
            11-level
        );


    document
    .getElementById(
        "timer"
    )
    .textContent=
        timeLeft;


    document
    .getElementById(
        "timerBox"
    )
    .classList
    .remove(
        "timerDanger"
    );


    timerID =
        setInterval(
        function(){

            timeLeft--;


            document
            .getElementById(
                "timer"
            )
            .textContent=
                timeLeft;


            if(timeLeft<=3){

                document
                .getElementById(
                    "timerBox"
                )
                .classList
                .add(
                    "timerDanger"
                );

            }


            if(timeLeft<=0){

                stopTimer();

                timeUp();

            }

        },
        1000
        );

}


function stopTimer(){

    if(timerID!==null){

        clearInterval(
            timerID
        );

        timerID=null;

    }

}


/* =========================
   TIME UP
========================= */

function timeUp(){

    if(locked){

        return;

    }


    locked=true;

    stopMovement();


    lives--;

    updateUI();


    playTimeUpSound();


    document
    .getElementById(
        "message"
    )
    .textContent=
        "TIME'S UP! ⏰";


    document
    .getElementById(
        "message"
    )
    .style.color=
        "#f44336";


    if(lives<=0){

        setTimeout(
            showGameOver,
            900
        );

        return;

    }


    setTimeout(
    function(){

        round++;

        newRound();

    },
    1000
    );

}


/* =========================
   CREATE CARDS
========================= */

function createCards(){

    const arena =
        document.getElementById(
            "arena"
        );


    arena.innerHTML="";

    cards=[];


    let amount=3;


    if(level>=3){

        amount=4;

    }


    if(level>=4){

        amount=5;

    }


    let choices=[
        target
    ];


    while(
        choices.length<amount
    ){

        const random =
            parts[
                Math.floor(
                    Math.random()*
                    parts.length
                )
            ];


        const exists =
            choices.some(
            function(item){

                return item.name===
                    random.name;

            });


        if(!exists){

            choices.push(
                random
            );

        }

    }


    choices.sort(
    function(){

        return Math.random()-0.5;

    });


    choices.forEach(
    function(part){

        const card =
            document.createElement(
                "div"
            );


        card.className="card";


        card.textContent=
            part.icon;


        const maxX =
            Math.max(
                5,
                arena.clientWidth-120
            );


        const maxY =
            Math.max(
                5,
                arena.clientHeight-105
            );


        const angle =
            Math.random()*
            Math.PI*2;


        const speed =
            0.6+
            Math.random()*0.8+
            level*0.15;


        const data={

            element:card,

            x:
                Math.random()*maxX,

            y:
                Math.random()*maxY,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed

        };


        cards.push(data);


        card.addEventListener(
            "click",
            function(){

                checkAnswer(
                    part.name,
                    data
                );

            }
        );


        arena.appendChild(
            card
        );

    });


    moveCards();

}


/* =========================
   MOVE CARDS
========================= */

function moveCards(){

    const arena =
        document.getElementById(
            "arena"
        );


    const width =
        arena.clientWidth;


    const height =
        arena.clientHeight;


    function animate(){

        if(locked){

            return;

        }


        cards.forEach(
        function(card){

            card.x +=
                card.vx;


            card.y +=
                card.vy;


            if(
                card.x<=0 ||
                card.x>=width-120
            ){

                card.vx=
                    -card.vx;

            }


            if(
                card.y<=0 ||
                card.y>=height-105
            ){

                card.vy=
                    -card.vy;

            }


            card.x=
                Math.max(
                    0,
                    Math.min(
                        card.x,
                        width-120
                    )
                );


            card.y=
                Math.max(
                    0,
                    Math.min(
                        card.y,
                        height-105
                    )
                );


            card.element.style.transform=
                "translate3d("+
                card.x+
                "px,"+
                card.y+
                "px,0)";

        });


        animationID =
            requestAnimationFrame(
                animate
            );

    }


    animate();

}


function stopMovement(){

    if(animationID!==null){

        cancelAnimationFrame(
            animationID
        );

        animationID=null;

    }

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
    name,
    card
){

    if(locked){

        return;

    }


    if(
        name===
        target.name
    ){

        correct();

    }

    else{

        wrong(card);

    }

}


/* =========================
   CORRECT
========================= */

function correct(){

    locked=true;

    stopMovement();

    stopTimer();


    score +=
        10+
        level*5;


    round++;


    updateUI();


    playWinSound();


    document
    .getElementById(
        "success"
    )
    .style.display=
        "flex";


    setTimeout(
    function(){

        document
        .getElementById(
            "success"
        )
        .style.display=
            "none";


        newRound();

    },
    900
    );

}


/* =========================
   WRONG
========================= */

function wrong(card){

    lives--;

    updateUI();

    playWrongSound();


    document
    .getElementById(
        "message"
    )
    .textContent=
        "TRY AGAIN! 😊";


    document
    .getElementById(
        "message"
    )
    .style.color=
        "#ff5c70";


    card.element.style.opacity=
        "0.35";


    setTimeout(
    function(){

        card.element.style.opacity=
            "1";

    },
    250
    );


    if(lives<=0){

        locked=true;

        stopMovement();

        stopTimer();


        document
        .getElementById(
            "message"
        )
        .textContent=
            "GAME OVER! 💔";


        document
        .getElementById(
            "message"
        )
        .style.color=
            "#f44336";


        setTimeout(
            showGameOver,
            900
        );

    }

}


/* =========================
   UPDATE UI
========================= */

function updateUI(){

    document
    .getElementById(
        "score"
    )
    .textContent=
        score;


    document
    .getElementById(
        "level"
    )
    .textContent=
        level;


    let hearts="";


    for(
        let i=0;
        i<lives;
        i++
    ){

        hearts+="❤️";

    }


    for(
        let i=lives;
        i<3;
        i++
    ){

        hearts+="🤍";

    }


    document
    .getElementById(
        "hearts"
    )
    .textContent=
        hearts;

}


/* =========================
   GAME OVER
========================= */

function showGameOver(){

    stopMovement();

    stopTimer();

    locked=true;


    music.pause();


    playGameOverSound();


    document
    .getElementById(
        "play"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "gameOverName"
    )
    .textContent=
        playerName;


    document
    .getElementById(
        "gameOverScore"
    )
    .textContent=
        score;


    document
    .getElementById(
        "gameOver"
    )
    .style.display=
        "flex";

}


/* =========================
   REAL WIN
========================= */

function finishGame(){

    stopMovement();

    stopTimer();

    locked=true;


    music.pause();


    document
    .getElementById(
        "play"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "finish"
    )
    .style.display=
        "flex";


    document
    .getElementById(
        "finalScore"
    )
    .textContent=
        score;

}


/* =========================
   BUTTONS
========================= */

document
.getElementById(
    "startButton"
)
.addEventListener(
    "click",
    startGame
);


document
.getElementById(
    "gameOverButton"
)
.addEventListener(
    "click",
    newGame
);


document
.getElementById(
    "finishButton"
)
.addEventListener(
    "click",
    newGame
);

</script>
